# patient_exceptions.yaml — excepciones por paciente (VA A GIT: solo AnonID + motivo)
# Ubicación: repo Python, data/harmonization/
# El preprocesador lo lee ANTES de resolver nombres de estructura.
# Depende de que AnonID sea estable entre exports (se verificó: los mismos IDs se repitieron
# entre exports sucesivos).
#
# Tres categorías:
#   excluded           sacados de la lista de minado. NO se exportan (no hay DICOM). Se registran
#                      para que no vuelvan al re-minar la lista.
#   out_of_convention  exportados, NO entran al train; quedan como conjunto reservado para
#                      evaluar generalización.
#   reviewed_ok        flagueados por el QA gate o por el extractor, ya revisados en Eclipse.
#                      Entran al train; se anotan para no volver a revisarlos.

excluded:
